<busconfig>
  <!-- no servicedir: nothing is activated, so nothing binds or mounts in the real XDG_RUNTIME_DIR -->
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
